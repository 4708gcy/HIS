# HIS AI Service v2.0 Configuration
# 配置中心：所有参数集中管理，无需修改代码即可调整行为

app:
  name: "HIS-AI-Service"
  version: "2.0.0"
  debug: false
  host: "127.0.0.1"
  port: 5001

# LLM 配置（支持 OpenAI 兼容接口，如阿里云百炼）
llm:
  api_key: ""                    # 建议通过环境变量 HIS_LLM_API_KEY 覆盖
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  model: "qwen-turbo"
  temperature: 0.3
  top_p: 0.9
  max_tokens: 1024
  timeout: 30

# HIS 数据库配置（与主项目共用 his_db）
database:
  host: "127.0.0.1"
  port: 3307
  user: "root"
  password: "123456"
  database: "his_db"
  charset: "utf8mb4"
  pool_size: 5

# 安全认证
security:
  api_key: ""                    # 建议通过环境变量 HIS_API_KEY 覆盖，默认 his-default-key

# 缓存配置
cache:
  ttl: 60                        # 内存缓存秒数

# 分析策略配置
analysis:
  default_strategy: "auto"       # traditional / llm / auto
  auto_threshold: 12             # 数据点 >= 12 用 traditional，否则用 llm
  few_shot_topk: 5               # 动态 few-shot 相似样本数

# RAG 知识库配置
rag:
  enabled: true
  embedding_model: "BAAI/bge-small-zh-v1.5"   # 轻量中文 Embedding
  chunk_size: 512
  chunk_overlap: 64
  top_k: 5
  vector_store: "faiss"                         # faiss / elasticsearch
  knowledge_base_dir: "./knowledge_base"

# 图表配置
charts:
  dpi: 150
  format: "png"
  output_dir: "./charts"
